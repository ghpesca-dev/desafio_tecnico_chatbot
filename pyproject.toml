[project]
name = "emporio"
version = "0.1.0"
description = "Agente de atendimento por texto da Empório da Música"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.42",
    "pandas>=3.1",
    "pydantic>=2.14",
    "python-dotenv>=1.2",
    "rapidfuzz>=3.14",
    "rich>=15.0",
    "unidecode>=1.4",
]

[project.optional-dependencies]
api = ["fastapi>=0.162", "uvicorn>=0.54"]

[project.scripts]
emporio = "emporio.cli:main"

[dependency-groups]
dev = [
    "fastapi>=0.162",
    "httpx>=0.28",
    "pdfplumber>=0.11",
    "pytest>=9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["e2e: cenários com LLM real; exigem OPENROUTER_API_KEY e geram custo"]
